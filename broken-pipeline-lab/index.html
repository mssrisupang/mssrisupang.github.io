<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Broken ML Pipeline Lab: interactive CPE312 demo of ML pipeline flaws (leakage, splits, thresholds, drift).">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Broken ML Pipeline Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an audit workbench. Scoreboard strip on top (claimed vs reality vs next month),
   then the pipeline + flaw switches on the left and the evidence panels on the right.
   A step-by-step guide docks at the bottom right and highlights the zone it talks about. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eef1f4;
  --ink: #12171d;
  --ink-2: #4a5562;
  --ink-3: #7c8794;
  --rule: #dde2e8;
  --rule-strong: #c4ccd5;
  --accent: #1f5fbf;
  --accent-soft: #e3ecfa;
  --flaw: #c4352f;
  --flaw-soft: #fbe9e7;
  --fixed: #127a3a;
  --fixed-soft: #e3f3e8;
  --warn: #9a6400;
  --warn-soft: #fbf0d9;
  --s1: #2a78d6; /* reported / test */
  --s2: #eb6834; /* Jan 2026 */
  --s3: #1baf7a; /* Feb 2026 */
  --grid: #e6e9ed;
  --shadow: 0 1px 2px rgba(18,23,29,.06), 0 4px 16px rgba(18,23,29,.05);
  --dock-shadow: 0 8px 32px rgba(18,23,29,.18);
  --f-display: "IBM Plex Sans Condensed", "IBM Plex Sans Thai", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", "IBM Plex Sans Thai", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1216; --surface: #161c22; --surface-2: #1d252d; --ink: #edf1f5; --ink-2: #b4bec9; --ink-3: #85909c;
    --rule: #28313a; --rule-strong: #38434e; --accent: #6ea3f0; --accent-soft: #1a2b45;
    --flaw: #f0716a; --flaw-soft: #3a1f1f; --fixed: #4cc77a; --fixed-soft: #15301f; --warn: #e2a93b; --warn-soft: #33280f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #232b33; --shadow: 0 1px 2px rgba(0,0,0,.3); --dock-shadow: 0 8px 32px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1216; --surface: #161c22; --surface-2: #1d252d; --ink: #edf1f5; --ink-2: #b4bec9; --ink-3: #85909c;
  --rule: #28313a; --rule-strong: #38434e; --accent: #6ea3f0; --accent-soft: #1a2b45;
  --flaw: #f0716a; --flaw-soft: #3a1f1f; --fixed: #4cc77a; --fixed-soft: #15301f; --warn: #e2a93b; --warn-soft: #33280f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #232b33; --shadow: 0 1px 2px rgba(0,0,0,.3); --dock-shadow: 0 8px 32px rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
html[lang="th"] body { line-height: 1.65; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 120px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .005em; }
h1 { font-size: 30px; font-weight: 700; line-height: 1.15; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
html[lang="th"] .eyebrow { letter-spacing: .02em; font-size: 12.5px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header.top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
header.top .title { display: grid; gap: 6px; min-width: 0; max-width: 700px; }
header.top .lede { color: var(--ink-2); font-size: 15px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:disabled { opacity: .45; cursor: default; }
.btn { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13.5px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.preset-bad[aria-pressed="true"] { background: var(--flaw); border-color: var(--flaw); color: #fff; }
.btn.preset-good[aria-pressed="true"] { background: var(--fixed); border-color: var(--fixed); color: #fff; }
.btn.guide-btn { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.check input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }

/* sticky status bar (appears once the header scrolls away) */
.statusbar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); box-shadow: var(--shadow); transform: translateY(-110%); transition: transform .2s; }
.statusbar.show { transform: none; }
.statusbar .in { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.statusbar .name { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.statusbar .btn, .statusbar .seg button { padding: 4px 9px; font-size: 12.5px; }
.statusbar .scores { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); margin-left: auto; }
.predict-help { flex-basis: 100%; font-size: 13px; color: var(--ink-2); background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; }

/* zone numbers */
.zone { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--surface); font-family: var(--f-mono); font-size: 13px; font-weight: 600; flex: none; }
.zone-head { display: flex; align-items: center; gap: 10px; }

/* scoreboard */
.board { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.board-head { grid-column: 1 / -1; padding: 14px 20px 0; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
.board .cell { padding: 14px 20px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; position: relative; }
.board .cell + .cell { border-left: 1px solid var(--rule); }
.board .label { display: flex; align-items: center; gap: 8px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.big { font-family: var(--f-mono); font-size: 44px; font-weight: 500; line-height: 1.05; letter-spacing: -.02em; }
.big .unit { font-size: 15px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; margin-left: 6px; }
.acc { font-family: var(--f-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.acc .unit { font-size: 12.5px; color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.sub { font-size: 13.5px; color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.chip.bad { background: var(--flaw-soft); color: var(--flaw); border-color: color-mix(in srgb, var(--flaw) 30%, transparent); }
.chip.good { background: var(--fixed-soft); color: var(--fixed); border-color: color-mix(in srgb, var(--fixed) 30%, transparent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.chip.neutral { background: var(--surface-2); color: var(--ink-2); border-color: var(--rule); }
.busy { position: absolute; top: 12px; right: 16px; }
.locked { display: grid; gap: 8px; }
.feb-q { font-weight: 600; font-size: 14.5px; }
.feb-guess summary { cursor: pointer; font-size: 13px; color: var(--accent); }
.feb-guess .predict-row { margin-top: 6px; }
.feb-ans { display: grid; gap: 6px; font-size: 13.5px; }
.feb-ans .rowc { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; }
.feb-ans .rowc .k { color: var(--ink-3); font-size: 12.5px; }
.feb-ans .rowc .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.feb-ans .down { color: var(--flaw); } .feb-ans .up { color: var(--fixed); }
.feb-ans .why { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.feb-ans .lesson { border-left: 3px solid var(--accent); padding-left: 8px; color: var(--ink-2); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font: inherit; }
.predict-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.predict-row label { display: grid; gap: 3px; font-size: 12px; color: var(--ink-3); }
.predict-row input { width: 92px; padding: 6px 8px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--surface); font-family: var(--f-mono); }
.board-foot { grid-column: 1 / -1; border-top: 1px solid var(--rule); overflow-x: auto; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
table.cmp th, table.cmp td { padding: 7px 14px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; font-family: var(--f-body); }
table.cmp thead th { font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
table.cmp tbody tr:last-child td { border-bottom: 0; }
table.cmp td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.cmp td.hidden-metric { color: var(--ink-3); font-family: var(--f-body); font-style: italic; }
table.cmp td .hint { font-family: var(--f-body); color: var(--ink-3); font-size: 12px; }

/* main grid */
.main { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { padding: 16px 18px 0; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
.panel-body { padding: 14px 18px 18px; }
.diagram { overflow-x: auto; }
.diagram svg { display: block; min-width: 720px; width: 100%; height: auto; }
.diagram { overflow: visible !important; min-width: 0; }
.panel-body > *, .tabpanel > *, .eda-body > * { min-width: 0; }
.chart { min-width: 0; }
.diagram text { font-family: var(--f-body); }
.legend-line { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend-line span { display: inline-flex; align-items: center; gap: 6px; }

/* flaw cards */
.flaw-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface-2); }
.flaw-bar .count { font-size: 13.5px; color: var(--ink-2); }
.flaw-bar .count b { font-family: var(--f-mono); color: var(--ink); }
.flaw-bar .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.all-on { color: var(--flaw); border-color: color-mix(in srgb, var(--flaw) 45%, var(--rule-strong)); }
.btn.all-off { color: var(--fixed); border-color: color-mix(in srgb, var(--fixed) 45%, var(--rule-strong)); }
.flaws { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.flaw { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; background: var(--surface); transition: border-color .2s, background-color .2s; }
.flaw.on { border-color: color-mix(in srgb, var(--flaw) 45%, var(--rule)); background: linear-gradient(var(--flaw-soft), var(--flaw-soft)) top / 100% 3px no-repeat, var(--surface); }
.flaw .row1 { display: flex; gap: 10px; align-items: start; justify-content: space-between; }
.flaw .code { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.flaw.on .code { color: var(--flaw); }
.flaw h3 { font-size: 15.5px; line-height: 1.3; }
.flaw .what { font-size: 13.5px; color: var(--ink-2); }
.flaw .fix { font-size: 13px; color: var(--ink-2); border-top: 1px dashed var(--rule); padding-top: 7px; }
.flaw .fix b { color: var(--fixed); font-weight: 600; }
.flaw .readout { font-family: var(--f-mono); font-size: 12.5px; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); }
.flaw .note { font-size: 12.5px; color: var(--ink-3); }
.tag { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--fixed); transition: background-color .2s; }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked ~ .track { background: var(--flaw); }
.switch input:checked ~ .knob { transform: translateX(18px); }
.switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.state-word { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.flaw.on .state-word { color: var(--flaw); }
.flaw:not(.on) .state-word { color: var(--fixed); }
.ask { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; font-size: 13px; }
.ask .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.ask .opts button { border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; }
.verdict { font-size: 13px; padding: 7px 10px; border-radius: 8px; background: var(--surface-2); }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 12px 12px 0; border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: transparent; padding: 8px 10px 9px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tabs .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--flaw); }
.tabpanel { padding: 16px 18px 18px; display: grid; gap: 12px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.zoombar { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-bottom: 4px; }
.zoombar button { width: 28px; height: 26px; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1; color: var(--ink-2); display: inline-grid; place-items: center; }
.zoombar button:hover { border-color: var(--ink-3); color: var(--ink); }
.zoombar span { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); min-width: 40px; text-align: center; }
.zscroll { overflow: auto; width: 100%; max-width: 100%; }
.zscroll svg { max-width: none; }
.chart text { font-family: var(--f-mono); font-size: 11px; fill: var(--ink-3); }
.chart text.axt { font-family: var(--f-body); font-size: 12px; fill: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-family: var(--f-mono); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 5; line-height: 1.4; }
.explain { font-size: 13.5px; color: var(--ink-2); }
.explain b { color: var(--ink); font-weight: 600; }
.slider-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
.cm { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px; font-size: 13px; }
.cm .h { font-size: 12px; color: var(--ink-3); align-self: end; padding: 2px 4px; }
.cm .rh { font-size: 12px; color: var(--ink-3); align-self: center; padding-right: 6px; text-align: right; }
.cm .c { border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.cm .c .v { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.cm .c .k { font-size: 12.5px; }
.cm .tp { background: var(--fixed-soft); } .cm .tp .k { color: var(--fixed); }
.cm .fn { background: var(--flaw-soft); } .cm .fn .k { color: var(--flaw); }
.cm .fp { background: var(--warn-soft); } .cm .fp .k { color: var(--warn); }
.cm .tn { background: var(--surface-2); } .cm .tn .k { color: var(--ink-2); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kv div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; gap: 1px; }
.kv .k { font-size: 12px; color: var(--ink-3); }
.kv .v { font-family: var(--f-mono); font-size: 17px; }
.monitor { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.monitor div { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 10px; font-size: 13px; border-bottom: 1px solid var(--rule); align-items: center; }
.monitor div:last-child { border-bottom: 0; }
.monitor .chip { white-space: normal; }
footer { color: var(--ink-3); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center; }
.seed-ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.seed-ctl input#seed { width: 84px !important; min-height: 32px !important; padding: 4px 8px !important; font-size: 14px !important; }
.info-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; line-height: 1; }
.info-btn[aria-expanded="true"] { background: var(--accent); color: #fff; }
.seed-ctl input#seed { width: 140px; height: auto; min-height: 38px; padding: 6px 10px; font-size: 16px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-family: var(--f-mono); }

/* summary (zone 4) */
.sum-body { display: grid; gap: 18px; }
.verdict-box { border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; border: 1px solid var(--rule); }
.verdict-box.bad { background: var(--flaw-soft); border-color: color-mix(in srgb, var(--flaw) 35%, var(--rule)); }
.verdict-box.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, var(--rule)); }
.verdict-box.good { background: var(--fixed-soft); border-color: color-mix(in srgb, var(--fixed) 35%, var(--rule)); }
.verdict-box h3 { font-size: 17px; }
table.stats.interp td { white-space: normal; vertical-align: top; font-family: var(--f-body); text-align: left; }
table.stats.interp td.num { font-family: var(--f-mono); white-space: nowrap; text-align: right; }
.learn { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.learn div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13.5px; }
.learn b { font-size: 14px; }
.learn .tag { justify-self: start; }

<script id="engine-src">
// Broken Pipeline Lab engine: synthetic telecom churn data + flawed/honest pipelines.
var Engine = (() => {
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    const u = mulberry32(seed);
    let spare = null;
    const r = {
      u,
      n() {
        if (spare !== null) { const s = spare; spare = null; return s; }
        let a = 0, b = 0;
        while (a === 0) a = u();
        b = u();
        const m = Math.sqrt(-2 * Math.log(a));
        spare = m * Math.sin(2 * Math.PI * b);
        return m * Math.cos(2 * Math.PI * b);
      },
      pois(l) { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= u(); } while (p > L); return k - 1; },
      pick(ws) { let x = u() * ws.reduce((a, b) => a + b, 0); for (let i = 0; i < ws.length; i++) { x -= ws[i]; if (x <= 0) return i; } return ws.length - 1; },
    };
    return r;
  }
  const sig = (z) => 1 / (1 + Math.exp(-Math.max(-30, Math.min(30, z))));

  const GP = { b0: -4.6, d0: 1.2, d1: -0.4, c0: 0.1, c1: 0.6, u: 0.2, u1: 1.3, tb: -0.45, n0: -5.7, billMu: 6.85, nHist: 20000, nEval: 6000 };
  const SURVEY = 30;
  const FEATURES = [
    'tenure_months', 'monthly_bill_thb', 'household_income_thb', 'age', 'data_usage_gb',
    'dropped_calls_pct', 'device_age_months', 'support_tickets_90d', 'late_payments_6m',
    'contract_month_to_month', 'contract_24_month', 'plan_fiber_bundle', 'plan_5g',
  ];
  for (let i = 1; i <= SURVEY; i++) FEATURES.push('survey_q' + i);
  FEATURES.push('retention_team_calls');
  const LEAK = FEATURES.length - 1;
  const IDX = Object.fromEntries(FEATURES.map((f, i) => [f, i]));
  const MONTHS = 48; // Jan 2022 .. Dec 2025; 48 = Jan 2026
  const monthLabel = (m) => ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m % 12] + ' ' + (2022 + Math.floor(m / 12));

  // kind: 'history' | 'today' | 'next'
  function generate(seed, nAccounts, kind) {
    const rng = makeRng(seed);
    const X = [], y = [], acct = [], month = [], plan = [];
    for (let a = 0; a < nAccounts; a++) {
      let m;
      if (kind === 'history') m = Math.floor(rng.u() * MONTHS);
      else if (kind === 'today') m = 48;
      else m = 49;
      const t = m / 47;
      const shifted = kind === 'next';
      const age = Math.max(18, Math.min(80, 40 + 12 * rng.n()));
      const income = Math.exp(Math.log(38000) + 0.5 * rng.n()) * (shifted ? 0.78 : 1);
      const contract = rng.pick([45, 35, 20]); // 0 m2m, 1 12mo, 2 24mo
      let p = shifted ? rng.pick([40, 22, 13, 25]) : rng.pick([55, 30, 15]); // 3 = 5G Unlimited (new)
      const lines = Math.min(5, 1 + rng.pois(0.6));
      const planBase = [450, 900, 750, 690][p];
      const bill = planBase * Math.exp(0.3 * rng.n()) * (1 + 0.4 * (lines - 1));
      const tenure = Math.floor(-30 * Math.log(1 - rng.u() * 0.999));
      const late = rng.pois(0.35 + (income < 25000 ? 0.7 : 0));
      const tickets = rng.pois(0.5 + (shifted ? 0.2 : 0));
      const survey = []; for (let i = 0; i < SURVEY; i++) survey.push(rng.n());
      const net = 0.7 * rng.n();
      const u = rng.n();
      const lineRows = [];
      let dropSum = 0, dataSum = 0;
      for (let l = 0; l < lines; l++) {
        const data = Math.exp(Math.log(15) + 0.6 * rng.n());
        const dropped = Math.max(0, 1.5 + net + 0.4 * rng.n());
        const dev = Math.floor(rng.u() * 48);
        dropSum += dropped; dataSum += Math.log(data);
        lineRows.push([data, dropped, dev]);
      }
      const zDrop = (dropSum / lines - 1.55) / 0.8;
      const zData = (dataSum / lines - Math.log(15)) / 0.6;
      const zTen = (Math.log1p(tenure) - 3.0) / 1.1;
      const zBill = (Math.log(bill) - GP.billMu) / 0.42;
      const zInc = (Math.log(income) - Math.log(38000)) / 0.5;
      let L;
      if (!shifted) {
        // slow drift: price sensitivity rises, network complaints matter less
        const cB = GP.c0 + GP.c1 * t, cD = GP.d0 + GP.d1 * t;
        L = GP.b0 + GP.tb * t * t + cD * zDrop + 0.45 * (tickets - 0.5) / 0.7 - 0.6 * zTen
          + (contract === 0 ? 1.0 : 0) - (contract === 2 ? 0.4 : 0) + 0.4 * (late - 0.5) / 0.8
          + cB * (zBill + 0.38) - 0.25 * zData + (GP.u + GP.u1 * t) * u;
      } else {
        // competitor launch + downturn: contract buy-outs, price shock, new plan type
        L = GP.n0 + 0.1 * zDrop + 0.45 * (tickets - 0.5) / 0.7
          + 0.4 * (late - 0.5) / 0.8
          + 1.8 * (zBill + 0.38) - 0.9 * zInc + (p === 3 ? 0.9 : 0) + 1.4 * u;
      }
      const yy = rng.u() < sig(L) ? 1 : 0;
      let calls = 0;
      if (kind === 'history') {
        if (yy) calls = rng.u() < 0.92 ? 1 + rng.pois(1.3) : 0;
        else calls = rng.u() < 0.012 ? 1 : 0;
      }
      for (const [data, dropped, dev] of lineRows) {
        const row = [tenure, bill, income, age, data, dropped, dev, tickets, late,
          contract === 0 ? 1 : 0, contract === 2 ? 1 : 0, p === 1 ? 1 : 0, p === 2 ? 1 : 0, ...survey, calls];
        X.push(row); y.push(yy); acct.push(a); month.push(m); plan.push(p);
      }
    }
    return { X, y, acct, month, plan };
  }

  // ---------- metrics ----------
  function avgPrecision(y, s) {
    const idx = s.map((v, i) => i).sort((a, b) => s[b] - s[a]);
    const P = y.reduce((a, b) => a + b, 0); if (!P) return 0;
    let tp = 0, fp = 0, ap = 0, i = 0;
    while (i < idx.length) {
      let j = i, dtp = 0, dfp = 0;
      while (j < idx.length && s[idx[j]] === s[idx[i]]) { if (y[idx[j]]) dtp++; else dfp++; j++; }
      tp += dtp; fp += dfp;
      ap += (dtp / P) * (tp / (tp + fp));
      i = j;
    }
    return ap;
  }
  function prCurve(y, s) {
    const idx = s.map((v, i) => i).sort((a, b) => s[b] - s[a]);
    const P = y.reduce((a, b) => a + b, 0);
    const pts = [{ r: 0, p: 1 }];
    let tp = 0, fp = 0, i = 0;
    while (i < idx.length) {
      let j = i;
      while (j < idx.length && s[idx[j]] === s[idx[i]]) { if (y[idx[j]]) tp++; else fp++; j++; }
      pts.push({ r: tp / P, p: tp / (tp + fp) });
      i = j;
    }
    // thin to <= 200 points
    if (pts.length > 200) { const st = pts.length / 200; const out = []; for (let k = 0; k < 200; k++) out.push(pts[Math.floor(k * st)]); out.push(pts[pts.length - 1]); return out; }
    return pts;
  }
  function rocAuc(y, s) {
    const idx = s.map((v, i) => i).sort((a, b) => s[a] - s[b]);
    let rank = 0, sumPos = 0, P = 0, i = 0;
    while (i < idx.length) {
      let j = i; while (j < idx.length && s[idx[j]] === s[idx[i]]) j++;
      const avg = (i + j + 1) / 2;

  let lang = 'th';
  try { const l = localStorage.getItem('bpl-lang'); if (l === 'en' || l === 'th') lang = l; } catch (e) {}
  const t = (k, ...a) => { const v = I[lang][k] !== undefined ? I[lang][k] : I.en[k]; return typeof v === 'function' ? v(...a) : v; };
  const ml = (m) => lang === 'th' ? THM[m % 12] + ' ' + (2022 + Math.floor(m / 12)) : E.monthLabel(m);

  // ================= state =================
  const state = {
    flaws: { ...CONSULTANT }, model: 'lr', threshold: null, predictFirst: false,
    released: false, tab: 'loss', seed: 11, ask: null, verdicts: {}, driftWhich: 'recent',
    guideOpen: true, step: 0,
  };
  try { const g = localStorage.getItem('bpl-guide'); if (g) { const o = JSON.parse(g); state.guideOpen = !!o.open; state.step = Math.min(STEPS.length - 1, Math.max(0, o.step | 0)); } } catch (e) {}
  let R = null;
  const cache = new Map();
  const driftCache = new Map();
  const $ = (id) => document.getElementById(id);

  // ================= worker =================
  let worker = null, reqId = 0;
  const pending = new Map();
  let localWorld = null;
  try {
    const src = $('engine-src').textContent + `
      let world = null;
      onmessage = (e) => {
        const m = e.data;
        try {
          if (m.type === 'build') { world = Engine.build(m.seed); postMessage({ id: m.id, ok: true }); }
          else if (m.type === 'run') postMessage({ id: m.id, ok: true, result: Engine.run(world, m.cfg) });
          else if (m.type === 'drift') postMessage({ id: m.id, ok: true, result: Engine.drift(world, m.which) });
          else if (m.type === 'describe') postMessage({ id: m.id, ok: true, result: Engine.describe(world, m.maxMonth) });
        } catch (err) { postMessage({ id: m.id, ok: false, error: String(err) }); }
      };`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = (e) => { const p = pending.get(e.data.id); if (!p) return; pending.delete(e.data.id); e.data.ok ? p.res(e.data.result) : p.rej(e.data.error); };
    worker.onerror = () => { worker = null; };
  } catch (err) { worker = null; }
  function call(msg) {
    if (worker) return new Promise((res, rej) => { const id = ++reqId; pending.set(id, { res, rej }); worker.postMessage({ ...msg, id }); });
    return new Promise((res) => setTimeout(() => {
      if (msg.type === 'build') { localWorld = E.build(msg.seed); res(true); }
      else if (msg.type === 'run') res(E.run(localWorld, msg.cfg));
      else if (msg.type === 'describe') res(E.describe(localWorld, msg.maxMonth));
      else res(E.drift(localWorld, msg.which));
    }, 20));
  }

  // ================= formatting =================
  const f3 = (v) => v.toFixed(3);
  const pct = (v) => (v * 100).toFixed(1) + '%';
  const baht = (v) => '฿' + Math.round(v).toLocaleString('en-US');
  const int = (v) => Math.round(v).toLocaleString('en-US');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const L = (th, en) => (lang === 'th' ? th : en);

  // ================= metrics =================
  function threshold() { return state.flaws.F5 ? 0.5 : (state.threshold != null ? state.threshold : R.costTh); }
  function M() {
    const th = threshold(), s = R.scores;
    return {
      th,
      rep: E.metrics(s.yTest, s.test, th), repB: E.baseline(s.yTest),
      today: E.metrics(s.yToday, s.today, th), todayB: E.baseline(s.yToday),
      next: E.metrics(s.yNext, s.next, th), nextB: E.baseline(s.yNext),
    };
  }

  // ================= running =================
  let runToken = 0;
  async function rerun() {
    const key = JSON.stringify({ f: state.flaws, m: state.model, s: state.seed });
    $('busy').hidden = false;
    const tok = ++runToken;
    let res = cache.get(key);
    if (!res) { res = await call({ type: 'run', cfg: { flaws: state.flaws, model: state.model } }); cache.set(key, res); }
    if (tok !== runToken) return;
    const prev = R; R = res;
    $('busy').hidden = true;
    if (state.ask && state.ask.answered && prev) settleVerdict(prev);
    render();
  }
  function settleVerdict(prev) {
    const a = state.ask; state.ask = null;
    const before = prev._rep, now = M().rep;
    const useAcc = state.flaws.F4 && prev._F4;
    const b = useAcc ? before.accuracy : before.prauc, n = useAcc ? now.accuracy : now.prauc;
    const d = n - b, eps = useAcc ? 0.002 : 0.01;
    const actual = d > eps ? 'up' : d < -eps ? 'down' : 'same';
    state.verdicts[a.id] = { ok: a.guess === actual, g: a.guess, b: useAcc ? pct(b) : f3(b), n: useAcc ? pct(n) : f3(n), k: useAcc ? 'accuracy' : 'PR-AUC' };
  }

    if (d > 0.03) return `<span class="chip warn">${t('over', f3(d))}</span>`;
    if (d < -0.03) return `<span class="chip neutral">${t('under', f3(-d))}</span>`;
    return `<span class="chip good">${t('within', f3(Math.abs(d)))}</span>`;
  }

      $('rep-sub').textContent = t('repSub', ml(tm[0]), ml(tm[1]), pct(m.rep.recall), m.th.toFixed(2));
      $('rep-chip').innerHTML = `<span class="chip neutral">${t('baseChipPr', f3(m.repB.prauc))}</span>`;
    }
    $('today-big').innerHTML = f3(m.today.prauc) + '<span class="unit">PR-AUC</span>';
    $('today-sub').textContent = t('todaySub', int(m.today.n), pct(m.today.recall), baht(m.today.costPer1000));
    $('today-chip').innerHTML = F.F4

      };
      const rows = [
        ['PR-AUC', arrow(m.today.prauc, m.next.prauc, f3)],
        ['Recall', arrow(m.today.recall, m.next.recall, pct)],
        [L('อัตราการย้ายค่าย', 'Churn rate'), `${pct(m.today.rate)} → ${pct(m.next.rate)}`],

  const zoomState = {};
  function attachZoom(el, key, baseMin) {
    if (!el) return;
    const svg = el.querySelector(':scope > svg') || el.querySelector('svg');
    if (!svg) return;
    let wrap = svg.parentElement.classList.contains('zscroll') ? svg.parentElement : null;
    if (!wrap) { wrap = document.createElement('div'); wrap.className = 'zscroll'; svg.before(wrap); wrap.append(svg); }
    let bar = el.querySelector(':scope > .zoombar');
    if (!bar) {
      bar = document.createElement('div'); bar.className = 'zoombar';
      bar.innerHTML = `<button type="button" data-z="-" aria-label="${L('ย่อ', 'Zoom out')}" title="${L('ย่อ', 'Zoom out')}">−</button><span></span><button type="button" data-z="+" aria-label="${L('ขยาย', 'Zoom in')}" title="${L('ขยาย', 'Zoom in')}">+</button><button type="button" data-z="0" aria-label="${L('ขนาดเดิม', 'Reset zoom')}" title="${L('ขนาดเดิม', 'Reset zoom')}">⟲</button>`;
      el.prepend(bar);
      bar.addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return;
        let s = zoomState[key] || 1;
        s = b.dataset.z === '+' ? Math.min(3, s + 0.25) : b.dataset.z === '-' ? Math.max(0.5, s - 0.25) : 1;
        zoomState[key] = s; apply();
      });
    }
    function apply() {
      const s = zoomState[key] || 1;
      svg.style.width = (s * 100) + '%';
      if (baseMin) svg.style.minWidth = (baseMin * s) + 'px';
      bar.querySelector('span').textContent = Math.round(s * 100) + '%';
      bar.querySelector('[data-z="-"]').disabled = s <= 0.5;
      bar.querySelector('[data-z="+"]').disabled = s >= 3;
    }
    apply();
  }

      'If a missed churner cost ฿2,000 instead of ฿8,000, which way would the best threshold move?',
      'The data shifts in February. Which alert rules would you set, and when would you retrain?',
      'In the real assignment (loan data), what evidence would you use to find each flaw?',
    ];

    $('sum-body').innerHTML = verdict + table
      + `<div><h3>${L('สิ่งที่ได้เรียนรู้', 'What we learnt')}</h3><div class="learn">${learn}</div></div>`
      + `<div><h3>${L('คำถามอภิปรายในชั้นเรียน', 'Questions for class discussion')}</h3><ol class="discuss">${qs.map((q) => `<li>${q}</li>`).join('')}</ol></div>`;
  }

  // ================= charts =================
  function axes(x0, x1, y0, y1, w, h, pad, xt, yt, xfmt, yfmt, titles) {
    const sx = (v) => pad.l + (v - x0) / (x1 - x0) * (w - pad.l - pad.r);
    const sy = (v) => h - pad.b - (v - y0) / (y1 - y0) * (h - pad.t - pad.b);
    let g = '';
    yt.forEach((v) => { g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/><text x="${pad.l - 6}" y="${sy(v) + 4}" text-anchor="end">${yfmt(v)}</text>`; });
    xt.forEach((v) => { g += `<text x="${sx(v)}" y="${h - pad.b + 16}" text-anchor="middle">${xfmt(v)}</text>`; });
    g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${h - pad.b}" y2="${h - pad.b}" stroke="var(--rule-strong)"/>`;
    if (titles && titles.x) g += `<text class="axt" x="${pad.l + (w - pad.l - pad.r) / 2}" y="${h - 6}" text-anchor="middle">${esc(titles.x)}</text>`;
    if (titles && titles.y) { const cy = pad.t + (h - pad.t - pad.b) / 2; g += `<text class="axt" x="14" y="${cy}" text-anchor="middle" transform="rotate(-90 14 ${cy})">${esc(titles.y)}</text>`; }
    return { sx, sy, g };
  }
  const path = (pts, sx, sy) => pts.map((p, i) => (i ? 'L' : 'M') + sx(p[0]).toFixed(1) + ',' + sy(p[1]).toFixed(1)).join('');
  function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
  function ticks(max, n = 4) { return Array.from({ length: n + 1 }, (_, i) => +(i * max / n).toFixed(6)); }
  function hoverLine(container, w, pad, sx, series, xfmt, fmtRow) {
    const svg = container.querySelector('svg'), tip = container.querySelector('.tip'), cross = svg.querySelector('.cross');
    const x0 = series[0].pts[0][0], x1 = series[0].pts[series[0].pts.length - 1][0];
    function move(ev) {
      const rect = svg.getBoundingClientRect();
      const vx = (ev.clientX - rect.left) / rect.width * w;
      const xv = x0 + (vx - pad.l) / (w - pad.l - pad.r) * (x1 - x0);
      if (xv < x0 || xv > x1) { leave(); return; }
      const near = series.map((s) => { let best = s.pts[0]; for (const p of s.pts) if (Math.abs(p[0] - xv) < Math.abs(best[0] - xv)) best = p; return { s, p: best }; });
      const cx = sx(near[0].p[0]);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.display = '';
      tip.hidden = false; tip.innerHTML = `${xfmt(near[0].p[0])}<br>` + near.map((o) => `<span style="color:${o.s.color}">■</span> ${o.s.name}: ${fmtRow(o.p[1])}`).join('<br>');
      tip.style.left = (cx / w * rect.width + rect.left - container.getBoundingClientRect().left) + 'px'; tip.style.top = '36px';
    }
    function leave() { tip.hidden = true; cross.style.display = 'none'; }
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerleave', leave);
  }

  function chartLoss() {
    if (state.model === 'knn') return `<p class="explain">${L('k-NN ไม่มีลูปการเทรน จึงไม่มี loss curve เปลี่ยนเป็น <b>logistic regression</b> เพื่อดู F3', 'k-NN has no training loop, so there is no loss curve. Switch to <b>logistic regression</b> to see F3.')}</p>`;
    const Ls = R.loss, bpe = Ls.batchesPerEpoch, F3 = state.flaws.F3;
    const epoch = Ls.epoch.map((v, i) => [i + 1, v]);
    const printed = Ls.epoch.map((_, i) => [i + 1, Ls.batch[Math.min(Ls.batch.length - 1, (i + 1) * bpe - 1)]]);
    const step = Math.max(1, Math.floor(Ls.batch.length / 400));
    const batches = []; for (let i = 0; i < Ls.batch.length; i += step) batches.push([1 + i / bpe, Ls.batch[i]]);
    const all = [...epoch, ...(F3 ? batches : [])].map((p) => p[1]).filter(isFinite);
    const ymax = niceMax(Math.min(Math.max(...all) * 1.05, F3 ? 40 : 1));
    const w = 520, h = 250, pad = { l: 60, r: 12, t: 12, b: 42 };
    const a = axes(0, Ls.epoch.length, 0, ymax, w, h, pad, [0, 5, 10, 15, 20], ticks(ymax), (v) => v, (v) => +v.toFixed(2),
      { x: L('Epoch (รอบที่เทรนครบข้อมูลทั้งหมด)', 'Epoch (full passes over the training data)'), y: L('Training loss (log loss)', 'Training loss (log loss)') });
    const clip = (pts) => pts.map((p) => [p[0], Math.min(ymax, p[1])]);
    let s = `<svg viewBox="0 0 ${w} ${h}">${a.g}`;
    if (F3) s += `<path d="${path(clip(batches), a.sx, a.sy)}" stroke="var(--s2)" stroke-width="1" fill="none" opacity=".55"/>`;
    s += `<path d="${path(clip(epoch), a.sx, a.sy)}" stroke="var(--s1)" stroke-width="2" fill="none"/>`;
    if (F3) s += printed.map((p) => `<circle cx="${a.sx(p[0])}" cy="${a.sy(Math.min(ymax, p[1]))}" r="3.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"/>`).join('');
    s += `<line class="cross" y1="${pad.t}" y2="${h - pad.b}" stroke="var(--ink-3)" stroke-dasharray="3 3" style="display:none"/></svg>`;
    const nEpoch = L('loss ของทั้ง epoch', 'full-epoch loss'), nPrinted = L('ค่าที่โน้ตบุ๊กพิมพ์', 'printed (last batch)');
    const series = [{ name: nEpoch, color: 'var(--s1)', pts: epoch }];
    if (F3) series.push({ name: nPrinted, color: 'var(--s3)', pts: printed });
    const legend = `<div class="legend-line"><span><span class="swatch" style="background:var(--s1)"></span>${L('loss ของข้อมูลเทรนทั้ง epoch', 'Training loss over the full epoch')}</span>${F3 ? `<span><span class="swatch" style="background:var(--s2)"></span>${L('ทุก mini-batch', 'Every mini-batch')}</span><span><span class="swatch" style="background:var(--s3)"></span>${L('ค่าที่โน้ตบุ๊กพิมพ์', 'What the notebook printed')}</span>` : ''}</div>`;
    const txt = F3
      ? `<p class="explain">${L('เมื่อค่าเงินบาทดิบมีหลักหมื่น และ learning rate = 1.0 การอัปเดตแต่ละครั้งจะเลยเป้า loss จึง<b>กระโดดไปมาแทนที่จะลดลง</b> การพิมพ์แค่ mini-batch สุดท้ายทำให้มองไม่เห็นปัญหานี้', 'With raw baht values in the thousands and a learning rate of 1.0, each update overshoots, so the loss <b>jumps around instead of going down</b>. Printing only the last mini-batch hides this.')}${Ls.diverged ? L(' น้ำหนักระเบิดแล้ว', ' The weights blew up.') : ''}</p>`
      : `<p class="explain">${L('อินพุตถูก scale และ learning rate = 0.2: loss ของทั้ง epoch ลดลงอย่างราบรื่นแล้วนิ่ง นี่คือหน้าตาของการลู่เข้า (convergence)', 'Scaled inputs and a learning rate of 0.2: the full-epoch loss falls smoothly and flattens out, which is what convergence looks like.')}</p>`;
    return { html: legend + `<div class="chart" id="ch">${s}<div class="tip" hidden></div></div>` + txt, after: (el) => hoverLine(el.querySelector('#ch'), w, pad, a.sx, series, (v) => 'epoch ' + v, (v) => v.toFixed(3)) };
  }

  function chartPR(m) {
    const w = 520, h = 270, pad = { l: 56, r: 12, t: 12, b: 42 };
    const c = { rep: E.prCurve(R.scores.yTest, R.scores.test), today: E.prCurve(R.scores.yToday, R.scores.today) };
    if (state.released) c.next = E.prCurve(R.scores.yNext, R.scores.next);
    const a = axes(0, 1, 0, 1, w, h, pad, [0, .25, .5, .75, 1], [0, .25, .5, .75, 1], (v) => v, (v) => v,
      { x: L('Recall (สัดส่วนลูกค้าที่ย้ายที่จับได้)', 'Recall (share of churners caught)'), y: L('Precision (ข้อเสนอที่ส่งถูกคน)', 'Precision (offers that hit)') });
    let s = `<svg viewBox="0 0 ${w} ${h}">${a.g}`;
    s += `<line x1="${a.sx(0)}" x2="${a.sx(1)}" y1="${a.sy(m.todayB.prauc)}" y2="${a.sy(m.todayB.prauc)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/><text x="${a.sx(1) - 4}" y="${a.sy(m.todayB.prauc) - 6}" text-anchor="end">${L('สุ่มเดา = อัตราการย้าย', 'guessing = churn rate')}</text>`;
    const draw = (pts, col) => `<path d="${path(pts.map((p) => [p.r, p.p]), a.sx, a.sy)}" stroke="${col}" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
    if (c.next) s += draw(c.next, 'var(--s3)');
    s += draw(c.today, 'var(--s2)') + draw(c.rep, 'var(--s1)');
    s += `<circle cx="${a.sx(m.today.recall)}" cy="${a.sy(m.today.precision || 0)}" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>`;
    s += `</svg>`;
    const legend = `<div class="legend-line"><span><span class="swatch" style="background:var(--s1)"></span>${L('Test set ของโน้ตบุ๊ก', 'Notebook test set')} · ${f3(m.rep.prauc)}</span><span><span class="swatch" style="background:var(--s2)"></span>${L('ม.ค. 2026', 'Jan 2026')} · ${f3(m.today.prauc)}</span>${c.next ? `<span><span class="swatch" style="background:var(--s3)"></span>${L('ก.พ. 2026', 'Feb 2026')} · ${f3(m.next.prauc)}</span>` : ''}</div>`;
    const txt = `<p class="explain">${L(`แกนตั้งคือ precision แกนนอนคือ recall PR-AUC คือพื้นที่ใต้เส้นโค้ง จุดกลมคือตำแหน่งที่ threshold ปัจจุบัน (${m.th.toFixed(2)}) พาไปในเดือน ม.ค. ถ้าเส้นน้ำเงินกับส้มห่างกัน แปลว่า test set ของโน้ตบุ๊กไม่ได้บอกความจริงเรื่องการใช้งานจริง`, `Precision (y-axis) against recall (x-axis). PR-AUC is the area under each curve. The dot is where the current threshold (${m.th.toFixed(2)}) puts you in January. A gap between the blue and orange curves means the notebook's test set is not telling the truth about deployment.`)}</p>`;
    return { html: legend + `<div class="chart">${s}</div>` + txt };
  }

  function chartCost(m) {
    const F5 = state.flaws.F5;
    const ths = []; for (let k = 1; k <= 60; k++) ths.push(k / 100);
    const costs = ths.map((th) => { const c = E.confusion(R.scores.yTest, R.scores.test, th); return [th, (c.fn * E.COST_FN + c.fp * E.COST_FP) / R.scores.yTest.length * 1000]; });
    const at50 = E.metrics(R.scores.yTest, R.scores.test, 0.5).costPer1000;
    const ymax = niceMax(Math.max(...costs.map((c) => c[1]), at50) * 1.05);
    const w = 520, h = 230, pad = { l: 70, r: 12, t: 12, b: 42 };
    const a = axes(0, 0.6, 0, ymax, w, h, pad, [0, .1, .2, .3, .4, .5, .6], ticks(ymax), (v) => v.toFixed(1), (v) => '฿' + (v / 1000) + 'k',
      { x: L('Threshold (ความน่าจะเป็นขั้นต่ำที่จะส่งข้อเสนอ)', 'Threshold (minimum probability that triggers an offer)'), y: L('ต้นทุนต่อลูกค้า 1,000 คน', 'Cost per 1,000 customers') });
    let s = `<svg viewBox="0 0 ${w} ${h}">${a.g}<path d="${path(costs, a.sx, a.sy)}" stroke="var(--s1)" stroke-width="2" fill="none"/>`;
    s += `<line x1="${a.sx(Math.min(0.6, m.th))}" x2="${a.sx(Math.min(0.6, m.th))}" y1="${pad.t}" y2="${h - pad.b}" stroke="${F5 ? 'var(--flaw)' : 'var(--fixed)'}" stroke-width="1.5"/>`;
    s += `<circle cx="${a.sx(Math.min(0.6, R.costTh))}" cy="${a.sy(costs[Math.min(59, Math.max(0, Math.round(R.costTh * 100) - 1))][1])}" r="5" fill="var(--fixed)" stroke="var(--surface)" stroke-width="2"/>`;
    s += `<line class="cross" y1="${pad.t}" y2="${h - pad.b}" stroke="var(--ink-3)" stroke-dasharray="3 3" style="display:none"/></svg>`;
    const c = m.today, n = c.n, per = (v) => int(v / n * 1000);
    const cm = `<div class="cm">
      <span></span><span class="h">${L('โมเดล: จะย้าย', 'Model: will churn')}</span><span class="h">${L('โมเดล: จะอยู่', 'Model: will stay')}</span>
      <span class="rh">${L('ย้ายจริง', 'Churned')}</span><div class="c tp"><span class="v">${per(c.tp)}</span><span class="k">${L('จับได้ ส่งข้อเสนอแล้ว', 'caught, offer sent')}</span></div><div class="c fn"><span class="v">${per(c.fn)}</span><span class="k">${L('หลุดไป', 'missed')} · ${baht(c.fn / n * 1000 * E.COST_FN)}</span></div>
      <span class="rh">${L('อยู่จริง', 'Stayed')}</span><div class="c fp"><span class="v">${per(c.fp)}</span><span class="k">${L('ข้อเสนอเสียเปล่า', 'wasted offer')} · ${baht(c.fp / n * 1000 * E.COST_FP)}</span></div><div class="c tn"><span class="v">${per(c.tn)}</span><span class="k">${L('ปล่อยไว้', 'left alone')}</span></div></div>`;
    const slider = `<div class="slider-row"><label for="th" class="small muted">Threshold</label><input type="range" id="th" min="0.01" max="0.6" step="0.01" value="${Math.min(0.6, m.th)}" ${F5 ? 'disabled' : ''}><span class="num">${m.th.toFixed(2)}</span></div>
      <p class="small muted">${F5 ? L('ล็อกไว้ที่ 0.50 ระหว่างที่ F5 เปิดอยู่ ปิด F5 เพื่อเลือก threshold เอง', 'Locked at 0.50 while F5 is on. Turn F5 off to choose a threshold.') : `${L('ค่าที่ต้นทุนต่ำสุดบน validation data:', 'Cost-optimal on validation data:')} <b class="num">${R.costTh.toFixed(2)}</b>. ${state.threshold != null ? `<button class="btn" id="th-reset" style="padding:2px 8px;font-size:12px">${L('รีเซ็ต', 'Reset')}</button>` : ''}`}</p>`;
    const txt = `<p class="explain">${L('ต้นทุนต่อลูกค้า 1,000 คนบน test set ของโน้ตบุ๊ก ในแต่ละ threshold พลาดลูกค้าที่จะย้าย 1 คนเสีย ฿8,000 ส่งข้อเสนอเสียเปล่า 1 ครั้งเสีย ฿500 threshold ที่ถูกที่สุดจึงต่ำกว่า 0.5 มาก', 'Cost per 1,000 customers on the notebook’s test set, for each threshold. A missed churner costs ฿8,000 and a wasted offer ฿500, so the cheapest threshold is far below 0.5.')}</p>`;
    return {
      html: slider + `<div class="chart" id="ch">${s}<div class="tip" hidden></div></div>` + txt + `<h3>${L('ต่อลูกค้า 1,000 คน ในเดือน ม.ค. 2026', 'Per 1,000 customers in January 2026')}</h3>` + cm,
      after: (el) => {
        hoverLine(el.querySelector('#ch'), w, pad, a.sx, [{ name: L('ต้นทุน', 'cost'), color: 'var(--s1)', pts: costs }], (v) => 'threshold ' + v.toFixed(2), (v) => baht(v) + L(' ต่อ 1,000 คน', ' per 1,000'));
        const th = el.querySelector('#th');
        if (th) {
          th.addEventListener('input', () => { state.threshold = +th.value; th.nextElementSibling.textContent = (+th.value).toFixed(2); const mm = M(); renderBoard(mm); renderDiagram(mm); renderFlawCards(mm); renderSummary(mm); });
          th.addEventListener('change', () => renderTab());
        }
        const rs = el.querySelector('#th-reset'); if (rs) rs.addEventListener('click', () => { state.threshold = null; render(); });
      },
    };
  }

  function barList(items, fmt, opts = {}) {
    const max = opts.max || Math.max(...items.map((i) => i.v), 1e-9);
    return `<div style="display:grid;gap:5px">${items.map((i) => `
      <div style="display:grid;grid-template-columns:minmax(0,180px) 1fr auto;gap:10px;align-items:center;font-size:12.5px" title="${esc(i.f)}: ${fmt(i.v)}">
        <span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${i.hot ? 'var(--flaw)' : 'var(--ink-2)'}">${esc(i.f)}</span>
        <span style="height:12px;background:var(--surface-2);border-radius:3px;position:relative;overflow:hidden">
          <span style="position:absolute;inset:0 auto 0 0;width:${Math.max(1, i.v / max * 100)}%;background:${i.hot ? 'var(--flaw)' : i.color || 'var(--s1)'};border-radius:0 4px 4px 0"></span>
          ${opts.line ? `<span style="position:absolute;top:-2px;bottom:-2px;left:${opts.line / max * 100}%;border-left:1.5px dashed var(--ink-3)"></span>` : ''}
        </span>
        <span class="num" style="min-width:52px;text-align:right">${fmt(i.v)}</span>
      </div>`).join('')}</div>`;
  }
  function chartFeatures() {
    const items = R.importance.slice(0, 12).map((o) => ({ f: o.f, v: o.v, hot: o.f === 'retention_team_calls' }));
    const leak = items.find((i) => i.hot);
    const how = state.model === 'knn' ? L('สัดส่วนสัญญาณแบบตัวแปรเดียวในอินพุตที่ถูกเลือก (k-NN ไม่มีสัมประสิทธิ์)', 'Share of univariate signal among the selected inputs (k-NN has no coefficients).') : L('สัดส่วนน้ำหนักสัมประสิทธิ์ (|coef|) ในโมเดลที่เทรนแล้ว', 'Share of the absolute coefficient weight in the trained model.');
    const msg = leak ? `<p class="explain">${L(`<b style="color:var(--flaw)">retention_team_calls</b> คิดเป็น ${pct(leak.v)} ของโมเดล คอลัมน์เดียวครองโมเดลแบบนี้คือสัญญาณคลาสสิกของ leakage ให้ถามว่าค่านี้รู้ได้เมื่อไร`, `<b style="color:var(--flaw)">retention_team_calls</b> carries ${pct(leak.v)} of the model. One column dominating is the classic sign of a leak: ask when that value becomes known.`)}</p>`
      : `<p class="explain">${L('ไม่มีคอลัมน์ไหนครองโมเดล อินพุตที่ถูกเลือกเป็นค่าที่บริษัทรู้ในวันที่ให้คะแนนลูกค้า', 'No single column dominates. The selected inputs are ones the operator knows on the day it scores a customer.')}</p>`;
    const noise = R.selected.some((x) => x.startsWith('survey_q'));
    const sel = `<p class="small muted">${L(`SelectKBest เลือกไว้ ${R.selected.length} จาก ${state.flaws.F2 ? 44 : 43} อินพุต (k ได้จากการจูน)${noise ? ' คอลัมน์ survey_q บางตัวเป็น noise ล้วนที่ถูกเลือกโดยบังเอิญ' : ''}`, `SelectKBest kept ${R.selected.length} of ${state.flaws.F2 ? 44 : 43} inputs (k chosen by tuning).${noise ? ' Some survey_q columns are pure noise that got picked by chance.' : ''}`)}</p>`;
    return { html: `<p class="small muted">${how}</p>` + barList(items, pct) + msg + sel };
  }
  function chartCalib() {
    const rel = E.reliability(R.scores.yToday, R.scores.today, 10);
    const w = 520, h = 260, pad = { l: 56, r: 12, t: 12, b: 42 };
    const mx = niceMax(Math.max(0.2, ...rel.pts.map((p) => Math.max(p.pred, p.obs))));
    const a = axes(0, mx, 0, mx, w, h, pad, ticks(mx), ticks(mx), (v) => +v.toFixed(2), (v) => +v.toFixed(2),
      { x: L('ความน่าจะเป็นที่โมเดลทำนาย', 'Predicted churn probability'), y: L('สัดส่วนที่ย้ายค่ายจริง', 'Share that actually churned') });

      [['stay', 'var(--s1)', 0], ['churn', 'var(--s2)', 1]].forEach(([k, col, o]) => {
        const v = hs[k][i], y = ha.sy(v);
        hsvg += `<rect x="${x + 1 + o * (half + 1)}" y="${y}" width="${Math.max(1, half)}" height="${Math.max(0, hh2 - hp.b - y)}" rx="2" fill="${col}" data-tip="${esc(lab)}<br>${k === 'stay' ? L('ไม่ย้าย', 'stayed') : L('ย้าย', 'churned')}: ${pct(v)}"/>`;
      });
      if (i % every === 0) hsvg += `<text x="${x + bwh / 2}" y="${hh2 - hp.b + 16}" text-anchor="middle">${fmtNum(F.f, edge(i))}</text>`;
    }
    hsvg += '</svg>';
    const opts = d.features.map((x) => `<option value="${x.f}" ${x.f === F.f ? 'selected' : ''}>${x.f}</option>`).join('');
    const histHtml = `<div style="display:grid;gap:10px">
      <div class="eda-hist-head"><h3>${L('การกระจายของข้อมูล แยกตามกลุ่ม', 'Distribution by group')}</h3><label class="small muted" for="eda-feat" style="display:inline-flex;gap:8px;align-items:center">${L('คอลัมน์', 'Column')} <select id="eda-feat">${opts}</select></label></div>
      <div class="legend-line"><span><span class="swatch" style="background:var(--s1)"></span>${L('ไม่ย้าย', 'Stayed')}</span><span><span class="swatch" style="background:var(--s2)"></span>${L('ย้ายค่าย', 'Churned')}</span></div>
      <div class="chart">${hsvg}<div class="tip" hidden></div></div>
      <p class="small muted">${L('แต่ละกลุ่มคิดเป็นเปอร์เซ็นต์ของกลุ่มตัวเอง จึงเทียบรูปร่างกันได้แม้กลุ่มย้ายจะมีแค่ราว 4% ถ้าสองสีซ้อนกันเกือบหมด คอลัมน์นั้นช่วยทำนายได้น้อย', 'Each group is shown as a percentage of itself, so the shapes compare fairly even though churners are only about 4%. If the two colours overlap almost completely, the column helps little.')}</p></div>`;

    const dictBlock = `<details class="gloss dict-box" open><summary><b>${L('พจนานุกรมข้อมูล: ความหมายของแต่ละคอลัมน์', 'Data dictionary: what each column means')}</b></summary><div style="padding:0 10px 10px;display:grid;gap:8px">${dictHtml(false)}</div></details>`;
    body.innerHTML = kpiHtml + dictBlock + `<div class="eda-grid">${quarterHtml}${catHtml}</div>` + statHtml + histHtml;
    bindTips(body);
    body.querySelectorAll('.chart').forEach((c, i) => attachZoom(c, 'eda' + i));
    $('eda-feat').addEventListener('change', (e) => { state.edaFeat = e.target.value; renderEDA(); });
  }
  $('eda-all').addEventListener('click', () => { state.edaRange = 48; renderEDA(); });
  $('eda-train').addEventListener('click', () => { state.edaRange = 36; renderEDA(); });
  $('eda-toggle').addEventListener('click', () => { state.edaOpen = !state.edaOpen; try { localStorage.setItem('bpl-eda-open', state.edaOpen ? '1' : '0'); } catch (e) {} renderEDA(); });

  // ================= guide =================
  let hlEls = [];
  function clearHL() { hlEls.forEach((el) => el.classList.remove('hl')); hlEls = []; }
  function saveGuide() { try { localStorage.setItem('bpl-guide', JSON.stringify({ open: state.guideOpen, step: state.step })); } catch (e) {} }
  function applyState(s, keepThreshold) {
    if (!s) return;
    if (s.flaws) state.flaws = { ...s.flaws };
    if (s.model) state.model = s.model;
    if ('released' in s) { state.released = s.released; if (s.released && !s.drift && state.driftWhich === 'recent') state.driftWhich = 'next'; }
    if (s.tab) state.tab = s.tab;
    if (s.drift) state.driftWhich = s.drift;
    if (!keepThreshold) state.threshold = null;
    state.ask = null; state.verdicts = {};
    syncPresets();
    if (R) render();
    rerun();
  }
  try { state.dockBig = localStorage.getItem('bpl-dock-big') === '1'; } catch (e) { state.dockBig = false; }
  function renderGuide(scroll) {
    $('dock').classList.toggle('expanded', !!state.dockBig);
    $('dock-exp').textContent = state.dockBig ? t('shrink') : t('expand');
    $('dock-exp').setAttribute('aria-pressed', !!state.dockBig);
    const n = STEPS.length, i = state.step, g = GT[lang][i];
    $('dock').hidden = !state.guideOpen; $('dock-pill').hidden = state.guideOpen;
    $('dock-pill').textContent = t('pill', i + 1, n);
    $('dock-step').textContent = t('stepOf', i + 1, n);
    $('dock-prog').innerHTML = STEPS.map((_, k) => `<button class="${k < i ? 'done' : k === i ? 'cur' : ''}" data-k="${k}" aria-label="${k + 1}"></button>`).join('');
    $('dock-prog').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => goStep(+b.dataset.k)));
    const gloss = (i === 0 ? `<details class="gloss"><summary>${t('glossTitle')}</summary><dl>${GLOSS[lang].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></details>` : '')
      + (i <= 1 ? `<details class="gloss"><summary>${L('ความหมายของคอลัมน์ในข้อมูล', 'What each data column means')}</summary><div style="padding:0 8px 8px">${dictHtml(true)}</div></details>` : '');
    $('dock-body').innerHTML = `<h3>${g.t}</h3>
      <div class="gsec do"><span class="k">${t('kDo')}</span><div>${g.do.startsWith('<ul') ? g.do : `<p>${g.do}</p>`}</div></div>
      <div class="gsec look"><span class="k">${t('kLook')}</span><p>${g.look}</p></div>
      <div class="gsec why"><span class="k">${t('kWhy')}</span><p>${g.why}</p></div>${gloss}`;
    $('dock-body').scrollTop = 0;
    $('g-prev').disabled = i === 0;
    $('g-next').textContent = i === n - 1 ? t('finish') : t('next');
    $('g-do').hidden = !STEPS[i].act;
    clearHL();
    if (state.guideOpen) {
      hlEls = STEPS[i].hl.map((id) => id === 'model-seg' ? $('model-lr').parentElement : $(id)).filter(Boolean);
      hlEls.forEach((el) => el.classList.add('hl'));
      if (scroll && hlEls[0]) hlEls[0].scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }
  }
  function goStep(k) {
    state.step = Math.max(0, Math.min(STEPS.length - 1, k));
    if (STEPS[state.step].eda && !state.edaOpen) { state.edaOpen = true; renderEDA(); }
    if (STEPS[state.step].hl.includes('sum-panel') && !state.sumOpen) { state.sumOpen = true; syncSumToggle(); }
    saveGuide();
    applyState(STEPS[state.step].setup);
    renderGuide(true);
  }
  $('g-next').addEventListener('click', () => { if (state.step === STEPS.length - 1) { state.guideOpen = false; saveGuide(); renderGuide(); } else goStep(state.step + 1); });
  $('g-prev').addEventListener('click', () => goStep(state.step - 1));
  $('g-do').addEventListener('click', () => { const a = STEPS[state.step].act; if (a) applyState(a); });
  $('dock-min').addEventListener('click', () => { state.guideOpen = false; saveGuide(); renderGuide(); });
  $('dock-exp').addEventListener('click', () => { state.dockBig = !state.dockBig; try { localStorage.setItem('bpl-dock-big', state.dockBig ? '1' : '0'); } catch (e) {} renderGuide(); });
  $('dock-pill').addEventListener('click', () => { state.guideOpen = true; saveGuide(); renderGuide(true); });
  $('open-guide').addEventListener('click', () => { state.guideOpen = true; saveGuide(); goStep(0); });

  // ================= controls =================
  $('preset-consultant').addEventListener('click', () => applyState({ flaws: CONSULTANT }));
  $('preset-auditor').addEventListener('click', () => applyState({ flaws: AUDITOR }));
  $('all-on').addEventListener('click', () => applyState({ flaws: Object.fromEntries(FIDS.map((f) => [f, true])) }));
  $('all-off').addEventListener('click', () => applyState({ flaws: AUDITOR }));
  $('model-lr').addEventListener('click', () => { state.model = 'lr'; syncPresets(); rerun(); });
  $('model-knn').addEventListener('click', () => { state.model = 'knn'; syncPresets(); rerun(); });
  $('predict-first').addEventListener('change', (e) => { state.predictFirst = e.target.checked; state.ask = null; renderAsk(); syncStatus(); });
  $('seed-info').addEventListener('click', () => { const h = $('seed-help'); h.hidden = !h.hidden; $('seed-info').setAttribute('aria-expanded', !h.hidden); });
  $('sum-toggle').addEventListener('click', () => { state.sumOpen = !state.sumOpen; try { localStorage.setItem('bpl-sum-open', state.sumOpen ? '1' : '0'); } catch (e) {} syncSumToggle(); });
  $('sb-consultant').addEventListener('click', () => $('preset-consultant').click());
  $('sb-auditor').addEventListener('click', () => $('preset-auditor').click());
  $('sb-lr').addEventListener('click', () => $('model-lr').click());
  $('sb-knn').addEventListener('click', () => $('model-knn').click());
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(([en]) => $('statusbar').classList.toggle('show', !en.isIntersecting)).observe(document.querySelector('header.top'));
  }
  $('release').addEventListener('click', () => { state.released = true; state.driftWhich = 'next'; render(); });
  $('relock').addEventListener('click', () => { state.released = false; if (state.driftWhich === 'next') state.driftWhich = 'recent'; render(); });
  ['pred-prauc', 'pred-recall'].forEach((id) => $(id).addEventListener('input', () => { if (state.released && R) renderBoard(M()); }));
  $('seed').addEventListener('change', async (e) => {
    const v = Math.max(1, Math.min(999, parseInt(e.target.value, 10) || 11)); e.target.value = v;
    state.seed = v; $('busy').hidden = false; await call({ type: 'build', seed: v }); rerun(); renderEDA();
  });
  const setLang = (l) => { lang = l; try { localStorage.setItem('bpl-lang', l); } catch (e) {} applyStatic(); flawText(); render(); renderGuide(); renderEDA(); syncSumToggle(); };
  $('lang-th').addEventListener('click', () => setLang('th'));
  $('lang-en').addEventListener('click', () => setLang('en'));

  // ================= boot =================
  buildFlaws(); applyStatic(); flawText(); syncPresets();
  if (state.guideOpen) { const s = STEPS[state.step].setup; if (s) { if (s.flaws) state.flaws = { ...s.flaws }; if (s.model) state.model = s.model; if ('released' in s) state.released = s.released; if (s.tab) state.tab = s.tab; if (s.drift) state.driftWhich = s.drift; syncPresets(); } }
  renderGuide(false);
  call({ type: 'build', seed: state.seed }).then(() => { rerun(); renderEDA(); });
})();
</script>

</body>
</html>
